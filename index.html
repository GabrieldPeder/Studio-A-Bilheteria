<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio A — Bilheteria</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --bg: #0c0a0d;
    --bg-panel: #17141a;
    --bg-panel-2: #1f1a22;
    --pink: #e4136f;
    --pink-soft: #f26fa8;
    --pink-deep: #8f0c47;
    --cream: #f6eef2;
    --muted: #9c8f97;
    --line: #34222d;
    --seat-free: #423844;
    --seat-free-hover: #554957;
    --seat-reserved: #f0c419;
    --seat-sold: var(--pink);
    --seat-aluno: #2a2530;
    --danger: #b0304a;
    --radius: 10px;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: radial-gradient(ellipse at top, #221420 0%, var(--bg) 55%);
    color:var(--cream); font-family:'Work Sans', sans-serif; min-height:100vh;
  }
  .app{max-width:1080px; margin:0 auto; padding:28px 20px 60px;}

  header.top{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{width:52px; height:52px; border-radius:12px; box-shadow:0 4px 14px rgba(228,19,111,.35);}
  .brand .txt{display:flex; flex-direction:column; gap:1px;}
  .brand .eyebrow{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--pink-soft); font-weight:600;}
  .brand h1{font-family:'Cormorant Garamond', serif; font-weight:700; font-size:30px; margin:0; line-height:1.05;}

  nav.tabs{display:flex; gap:6px; background:var(--bg-panel); padding:5px; border-radius:12px; border:1px solid var(--line);}
  nav.tabs button{
    background:transparent; border:none; color:var(--muted); font-family:'Work Sans',sans-serif;
    font-weight:600; font-size:13px; padding:9px 14px; border-radius:8px; cursor:pointer; transition:.15s;
  }
  nav.tabs button.active{background:var(--pink); color:#1c0710; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);}
  nav.tabs button:hover:not(.active){color:var(--cream);}

  .panel{background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:var(--shadow); margin-bottom:18px;}
  .panel h2{font-family:'Cormorant Garamond', serif; font-size:22px; margin:0 0 14px; color:var(--pink-soft); font-weight:700;}
  .row{display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
  label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}
  select, input, textarea{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cream); border-radius:8px;
    padding:9px 11px; font-family:inherit; font-size:14px; outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--pink);}
  .field{display:flex; flex-direction:column; min-width:160px;}
  .btn{
    background:var(--pink-deep); color:var(--cream); border:1px solid rgba(242,111,168,.35); border-radius:8px;
    padding:10px 16px; font-weight:600; font-size:13px; cursor:pointer; transition:.15s; font-family:inherit;
  }
  .btn:hover{background:#6d0936; border-color:var(--pink);}
  .btn.gold{background:var(--pink); color:#210a15; border-color:var(--pink);}
  .btn.gold:hover{background:var(--pink-soft);}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .btn.ghost:hover{color:var(--cream); border-color:var(--pink);}
  .btn.danger{background:transparent; border:1px solid var(--danger); color:#f0a3b3;}
  .btn.danger:hover{background:var(--danger); color:var(--cream);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .stage-wrap{margin:26px 0 10px; display:flex; flex-direction:column; align-items:center;}
  .stage{
    width:min(560px, 92%); height:34px; border-radius:50% / 100px;
    background: linear-gradient(180deg, rgba(228,19,111,.35), rgba(228,19,111,.05) 70%);
    box-shadow: 0 -6px 24px rgba(228,19,111,.25), inset 0 -10px 18px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; margin-bottom:26px;
  }
  .stage span{font-family:'Cormorant Garamond', serif; letter-spacing:.4em; font-size:12px; color:var(--pink-soft); text-transform:uppercase; font-weight:600;}

  .seatmap{display:flex; flex-direction:column; align-items:center; gap:7px; overflow-x:auto; padding:6px 4px 14px; width:100%;}
  .seat-row{display:flex; align-items:center; gap:6px;}
  .row-label{width:18px; font-size:11px; color:var(--muted); font-weight:700; text-align:center;}
  .seat{
    width:20px; height:19px; border-radius:5px 5px 3px 3px; border:1px solid rgba(0,0,0,.3);
    background:var(--seat-free); cursor:pointer; font-size:8px; color:transparent;
    transition:.12s; flex:0 0 auto;
  }
  .seat.aisle-gap{background:transparent; border:none; cursor:default; width:16px;}
  .seat:hover:not(.aisle-gap):not(.readonly){background:var(--seat-free-hover); transform:translateY(-1px);}
  .seat.reservado{background:var(--seat-reserved);}
  .seat.vendido{background:var(--seat-sold);}
  .seat.aluno{
    background: repeating-linear-gradient(45deg, var(--seat-aluno), var(--seat-aluno) 3px, #14111a 3px, #14111a 6px);
    cursor:default; border-color:rgba(255,255,255,.08);
  }
  .seat.readonly{cursor:default;}

  .legend{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
  .legend .item{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);}
  .legend .swatch{width:13px; height:13px; border-radius:3px;}
  .legend .swatch.aluno-sw{background: repeating-linear-gradient(45deg, var(--seat-aluno), var(--seat-aluno) 3px, #14111a 3px, #14111a 6px);}

  .summary{display:flex; gap:22px; flex-wrap:wrap; justify-content:center; margin:18px 0 6px;}
  .summary .stat{text-align:center;}
  .summary .stat b{display:block; font-family:'Cormorant Garamond', serif; font-size:26px; color:var(--pink-soft);}
  .summary .stat span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}

  .empty{color:var(--muted); font-size:14px; padding:20px 0; text-align:center;}

  .overlay{position:fixed; inset:0; background:rgba(10,7,9,.65); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:22px; width:100%; max-width:380px; box-shadow:var(--shadow);}
  .modal h3{font-family:'Cormorant Garamond', serif; margin:0 0 4px; font-size:22px; color:var(--pink-soft);}
  .modal .sub{color:var(--muted); font-size:12.5px; margin-bottom:16px;}
  .status-choices{display:flex; gap:8px; margin-bottom:14px;}
  .status-choices label{flex:1; text-align:center; border:1px solid var(--line); border-radius:8px; padding:9px 4px; cursor:pointer; font-size:12px; text-transform:none; letter-spacing:0; font-weight:600; color:var(--muted);}
  .status-choices input{display:none;}
  .status-choices input:checked + span{color:var(--cream);}
  .status-choices label:has(input:checked){border-color:var(--pink); background:rgba(228,19,111,.14); color:var(--cream);}
  .modal .field{width:100%; margin-bottom:12px;}
  .modal .field input, .modal .field textarea{width:100%;}
  .modal-actions{display:flex; justify-content:space-between; gap:8px; margin-top:16px;}
  .ticket-actions{display:flex; gap:8px; margin-bottom:14px;}
  .ticket-actions button{flex:1;}

  .print-only{display:none;}
  @media print{
    body *{visibility:hidden;}
    .print-only, .print-only *{visibility:visible;}
    .print-only{display:block; position:fixed; inset:0; background:#fff;}
    .ticket{
      width:320px; margin:40px auto; text-align:center; font-family:'Work Sans', sans-serif;
      border:2px dashed #000; border-radius:14px; padding:24px; color:#000;
    }
    .ticket-logo{width:64px; height:64px; border-radius:12px; margin-bottom:8px;}
    .ticket h2{font-family:'Cormorant Garamond', serif; margin:4px 0; font-size:24px;}
    .ticket-show{font-weight:700; font-size:16px; margin:6px 0 2px;}
    .ticket-session{color:#444; font-size:13px; margin:0 0 10px;}
    .ticket-seat{font-size:20px; margin:10px 0 4px;}
    .ticket-name{font-size:14px; margin:0 0 10px;}
    .ticket-qr{width:120px; height:120px; margin:10px auto;}
    .ticket-code{letter-spacing:.1em; font-size:12px; color:#666;}
    .ticket-status{display:inline-block; margin-top:10px; padding:4px 14px; border:1px solid #000; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.05em;}
  }

  .show-card{background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;}
  .show-card .show-head{display:flex; gap:10px; align-items:center; margin-bottom:10px;}
  .show-head input{flex:1; font-weight:700; font-size:15px;}
  .session-row{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .session-row input{padding:7px 9px; font-size:13px;}
  .tiny{font-size:11px; padding:6px 9px;}

  .search-box{display:flex; gap:8px; margin-bottom:14px;}
  .search-box input{flex:1;}
  .found-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .found-item{display:flex; justify-content:space-between; align-items:center; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px;}
  .found-item b{color:var(--pink-soft);}

  .badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
  .badge.reservado{background:rgba(240,196,25,.18); color:#f0c419;}
  .badge.vendido{background:rgba(228,19,111,.22); color:var(--pink-soft);}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--pink); color:#210a15; padding:10px 18px; border-radius:8px; font-weight:600; font-size:13px; box-shadow:var(--shadow); z-index:60; opacity:0; pointer-events:none; transition:.25s;}
  .toast.show{opacity:1; transform:translate(-50%,-6px);}

  .note{font-size:12px; color:var(--muted); margin-top:4px;}

  .scan-wrap{margin:14px 0;}
  #scanVideo{width:100%; max-width:420px; border-radius:12px; border:2px solid var(--pink); display:block;}
  .scan-banner{margin-top:14px; padding:12px 14px; border-radius:10px; font-weight:600; font-size:14px;}
  .scan-banner.ok{background:rgba(60,180,110,.15); color:#8fe0b0; border:1px solid #3cb46e;}
  .scan-banner.warn{background:rgba(240,196,25,.15); color:#f0c419; border:1px solid #f0c419;}
  .scan-banner.invalid{background:rgba(176,48,74,.18); color:#f0a3b3; border:1px solid var(--danger);}
  .checkin-box{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:12.5px; color:var(--muted); margin-bottom:14px; flex-wrap:wrap;}
  .checkin-box.in{color:#8fe0b0;}

  .auth-status{display:flex; align-items:center; gap:10px;}
  .auth-status .who{font-size:12px; color:var(--muted);}
  .login-screen{max-width:360px; margin:40px auto;}
  .login-screen .field{width:100%; margin-bottom:12px;}
  .login-screen .field input{width:100%;}

  .setup-screen{max-width:560px; margin:60px auto; text-align:left;}
  .setup-screen code{background:var(--bg-panel-2); padding:2px 6px; border-radius:5px; color:var(--pink-soft); font-size:12.5px;}
  .setup-screen ol{padding-left:20px; line-height:1.9; font-size:14px;}
  .setup-screen pre{background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px; padding:14px; font-size:12px; overflow-x:auto; color:var(--pink-soft);}

  @media(max-width:520px){
    .app{padding:18px 12px 40px;}
    header.top{gap:10px;}
    .brand h1{font-size:22px;}
    .brand img{width:42px; height:42px;}
    nav.tabs{width:100%; justify-content:space-between;}
    nav.tabs button{flex:1; padding:8px 6px; font-size:11.5px;}
    .auth-status{width:100%; justify-content:flex-end;}
    .panel{padding:16px;}
    .row{gap:10px;}
    .field{min-width:0; flex:1 1 140px;}
    .search-box{flex-direction:column; align-items:stretch;}
    .search-box button{align-self:flex-end;}
    .modal{max-width:100%;}
    .status-choices{flex-wrap:wrap;}
    .ticket-actions{flex-direction:column;}
    .summary{gap:14px;}
    .summary .stat b{font-size:21px;}
    .seatmap{padding:6px 2px 10px;}
    .seat{width:13px; height:12px; border-radius:3px 3px 2px 2px;}
    .seat-row{gap:3px;}
    .aisle-gap{width:9px;}
    .row-label{width:12px; font-size:8px;}
  }
  @media(max-width:360px){
    .brand .eyebrow{display:none;}
  }
</style>
</head>

const firebaseConfig = {

const FIREBASE_READY = firebaseConfig.apiKey !== "SUA_API_KEY";
let db = null;
let auth = null;
let currentUser = null;
if(FIREBASE_READY){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  auth = firebase.auth();
  auth.onAuthStateChanged(user=>{
    currentUser = user;
    updateAuthStatus();
    if(currentTab==='painel' || currentTab==='config'){ switchTab(currentTab); }
  });
}
function updateAuthStatus(){
  const el = document.getElementById('authStatus');
  if(!el) return;
  if(currentUser){
    el.innerHTML = `<span class="who">${escapeHtml(currentUser.email)}</span><button class="btn ghost tiny" id="btnLogout">Sair</button>`;
    const b = document.getElementById('btnLogout');
    if(b) b.addEventListener('click', ()=> auth.signOut());
  } else {
    el.innerHTML = '';
  }
}
function renderLoginScreen(){
  detachLiveSeats();
  document.getElementById('content').innerHTML = `<div class="panel login-screen">
    <h2>Entrar</h2>
    <p class="note" style="margin-top:-6px;">Acesso restrito à equipe do Studio A.</p>
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" placeholder="seuemail@exemplo.com"/></div>

    <button class="btn gold" id="btnEntrar" style="margin-top:8px;">Entrar</button>
    <p class="note" id="loginErro" style="color:#f0a3b3;"></p>
  </div>`;
  const tryLogin = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value;
    try{
      await auth.signInWithEmailAndPassword(email, senha);
    }catch(e){
      document.getElementById('loginErro').textContent = 'E-mail ou senha incorretos.';
    }
  };
  document.getElementById('btnEntrar').addEventListener('click', tryLogin);
  document.getElementById('loginSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,8); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function rowLetter(i){ return String.fromCharCode(65+i); }
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Config ---------- */
async function loadConfig(){
  try{
    const snap = await db.ref('config').once('value');
    CONFIG = snap.val();
  }catch(e){ CONFIG = null; }
  if(!CONFIG){
    CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    await saveConfig();
  }
  if(!CONFIG.shows) CONFIG.shows = [];
  if(!currentShowId && CONFIG.shows.length) currentShowId = CONFIG.shows[0].id;
  syncCurrentSession();
}
async function saveConfig(){
  try{ await db.ref('config').set(CONFIG); }
  catch(e){ showToast('Erro ao salvar configuração'); }
}
function syncCurrentSession(){
  const show = CONFIG.shows.find(s=>s.id===currentShowId);
  if(show && show.sessions && show.sessions.length){
    if(!currentSessionId || !show.sessions.find(se=>se.id===currentSessionId)){
      currentSessionId = show.sessions[0].id;
    }
  } else {
    currentSessionId = null;
  }
}

/* ---------- Seats (realtime) ---------- */
function detachLiveSeats(){
  if(liveSeatsRef && liveSeatsHandler){ liveSeatsRef.off('value', liveSeatsHandler); }
  liveSeatsRef = null; liveSeatsHandler = null;
}
function attachLiveSeats(sessionId, onUpdate){
  detachLiveSeats();
  if(!sessionId) return;
  liveSeatsRef = db.ref('seats/'+sessionId);
  liveSeatsHandler = (snap)=>{
    const data = snap.val() || {};
    SEATS_CACHE[sessionId] = data;
    onUpdate(data);
  };
  liveSeatsRef.on('value', liveSeatsHandler);
}
async function saveSeat(sessionId, seatId, seatData){
  try{
    if(seatData === null){
      await db.ref('seats/'+sessionId+'/'+seatId).remove();
    } else {
      await db.ref('seats/'+sessionId+'/'+seatId).set(seatData);
    }
  }catch(e){ showToast('Erro ao salvar assento'); }
}

/* ---------- Layout helpers (3 quadrantes) ---------- */
function rowWidth(){ return CONFIG.seatsLeft + CONFIG.seatsCenter + CONFIG.seatsRight; }
function blockOf(n){
  if(n <= CONFIG.seatsLeft) return 'left';
  if(n <= CONFIG.seatsLeft + CONFIG.seatsCenter) return 'center';
  return 'right';
}

function renderSeatMap(seats, readonly){
  const width = rowWidth();
  let html = '<div class="stage-wrap"><div class="stage"><span>Palco</span></div><div class="seatmap">';
  for(let r=0;r<CONFIG.rows;r++){
    html += `<div class="seat-row"><div class="row-label">${rowLetter(r)}</div>`;
    for(let n=1;n<=width;n++){
      const id = rowLetter(r)+n;
      const block = blockOf(n);
      if(block==='right'){
        html += `<div class="seat aluno" title="Reservado — alunos"></div>`;
      } else {
        const st = seats[id] ? seats[id].status : 'livre';
        const cls = st==='livre' ? '' : st;
        html += `<div class="seat ${cls} ${readonly?'readonly':''}" data-seat="${id}" title="${id}"></div>`;
      }
      if(n === CONFIG.seatsLeft || n === CONFIG.seatsLeft + CONFIG.seatsCenter){
        html += `<div class="seat aisle-gap"></div>`;
      }
    }
    html += `</div>`;
  }
  html += '</div></div>';
  html += `<div class="legend">
    <div class="item"><span class="swatch" style="background:var(--seat-free)"></span>Disponível</div>
    <div class="item"><span class="swatch" style="background:var(--seat-reserved)"></span>Reservado</div>
    <div class="item"><span class="swatch" style="background:var(--seat-sold)"></span>Vendido / Pago</div>
    <div class="item"><span class="swatch aluno-sw"></span>Reservado — alunos</div>
  </div>`;
  return html;
}

function computeSummary(seats){
  const sellable = CONFIG.rows * (CONFIG.seatsLeft + CONFIG.seatsCenter);
  const alunos = CONFIG.rows * CONFIG.seatsRight;
  let reservado=0, vendido=0;
  Object.values(seats).forEach(s=>{
    if(s.status==='reservado') reservado++;
    if(s.status==='vendido') vendido++;
  });
  const livre = sellable - reservado - vendido;
  return {sellable, livre, reservado, vendido, alunos};
}

function sessionLabel(session){
  const parts = [];
  if(session.date) parts.push(session.date);
  if(session.time) parts.push(session.time);
  return parts.length ? parts.join(' · ') : 'Sessão sem data definida';
}

function fitSeatmap(container){
  const map = container.querySelector('.seatmap');
  if(!map) return;
  map.style.zoom = '1';
  const firstRow = map.querySelector('.seat-row');
  if(!firstRow) return;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const natural = firstRow.scrollWidth;
      const available = map.clientWidth;
      if(natural > available && available > 0){
        const ratio = Math.max(0.4, (available - 4) / natural);
        map.style.zoom = ratio;
      } else {
        map.style.zoom = '1';
      }
    });
  });
}
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    const mapArea = document.getElementById('mapArea');
    if(mapArea) fitSeatmap(mapArea);
  }, 150);
});

function showSessionSelector(){
  const show = CONFIG.shows.find(s=>s.id===currentShowId);
  let html = '<div class="row" style="margin-bottom:4px;">';
  html += `<div class="field"><label>Espetáculo</label><select id="selShow">`;
  CONFIG.shows.forEach(s=>{
    html += `<option value="${s.id}" ${s.id===currentShowId?'selected':''}>${escapeHtml(s.name)}</option>`;
  });
  html += `</select></div>`;
  html += `<div class="field"><label>Sessão</label><select id="selSession">`;
  if(show && show.sessions && show.sessions.length){
    show.sessions.forEach(se=>{
      html += `<option value="${se.id}" ${se.id===currentSessionId?'selected':''}>${escapeHtml(sessionLabel(se))}</option>`;
    });
  } else {
    html += `<option value="">Nenhuma sessão cadastrada</option>`;
  }
  html += `</select></div></div>`;
  return html;
}

async function doSearch(){
  const term = document.getElementById('buscaComprador').value.trim().toLowerCase();
  const seats = SEATS_CACHE[currentSessionId] || {};
  const box = document.getElementById('foundResults');
  if(!term){ box.innerHTML=''; return; }
  const results = Object.entries(seats).filter(([id,d]) => d.nome && d.nome.toLowerCase().includes(term));
  if(!results.length){ box.innerHTML = '<div class="empty">Nenhum comprador encontrado nesta sessão.</div>'; return; }
  box.innerHTML = '<div class="found-list">' + results.map(([id,d])=>
    `<div class="found-item"><span>Assento <b>${id}</b> — ${escapeHtml(d.nome)} ${d.telefone?('· '+escapeHtml(d.telefone)):''}</span><span class="badge ${d.status}">${d.status}</span></div>`
  ).join('') + '</div>';
}

    </div>

    ${data.status && data.status!=='livre' ? `<div class="ticket-actions">
      <button class="btn ghost tiny" id="btnImprimir" type="button">🖨️ Imprimir ingresso</button>
      <button class="btn ghost tiny" id="btnEnviarEmail" type="button" ${data.email?'':'disabled title="Preencha e salve o e-mail primeiro"'}>✉️ Enviar por e-mail</button>
    </div>
    <div class="checkin-box ${data.checkin?'in':''}">
      ${data.checkin ? `✅ Entrada confirmada às ${new Date(data.checkinAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}` : '⏳ Ainda não deu entrada na sala'}
      <button class="btn ghost tiny" id="btnToggleCheckin" type="button">${data.checkin ? 'Desfazer entrada' : 'Marcar entrada manualmente'}</button>

      <button class="btn danger tiny" id="btnLimpar">Liberar assento</button>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost" id="btnCancelar">Cancelar</button>
        <button class="btn gold" id="btnSalvar">Salvar</button>
      </div>
    </div>
  </div>`;

  overlay.querySelector('#btnLimpar').addEventListener('click', async ()=>{
    await saveSeat(currentSessionId, seatId, null);
    overlay.remove();
    showToast('Assento liberado');
  });
  overlay.querySelector('#btnSalvar').addEventListener('click', async ()=>{
    const status = overlay.querySelector('input[name="st"]:checked').value;
    const nome = overlay.querySelector('#fNome').value.trim();
    const telefone = overlay.querySelector('#fTel').value.trim();
    const email = overlay.querySelector('#fEmail').value.trim();
    const obs = overlay.querySelector('#fObs').value.trim();

/* ---------- Ingresso (imprimir / e-mail) ---------- */
function ticketCode(sessionId, seatId){
  return sessionId+'-'+seatId;
}
function findShowAndSession(sessionId){
  for(const show of CONFIG.shows){
    const session = (show.sessions||[]).find(se=>se.id===sessionId);
    if(session) return {show, session};
  }
  return null;
}
function buildTicketHtml({seatId, show, session, nome, status}){
  const code = ticketCode(currentSessionId, seatId);
  const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=' + encodeURIComponent('STUDIOA|'+code);
  return `
    <div class="ticket">
      <img class="ticket-logo" src="${document.querySelector('.brand img').src}" alt="Studio A"/>
      <h2>Studio A</h2>
      <p class="ticket-show">${escapeHtml(show.name||'')}</p>
      <p class="ticket-session">${escapeHtml(sessionLabel(session))}</p>
      <p class="ticket-seat">Assento <b>${seatId}</b></p>
      <p class="ticket-name">${escapeHtml(nome||'')}</p>
      <img class="ticket-qr" src="${qr}" alt="QR"/>
      <p class="ticket-code">${code.toUpperCase()}</p>
      <p class="ticket-status">${status==='vendido' ? 'PAGO' : 'RESERVADO'}</p>
    </div>`;
}
function printTicket(info){
  const holder = document.getElementById('printArea');
  holder.innerHTML = buildTicketHtml(info);
  window.print();
}
async function sendTicketEmail(info){
  if(!EMAILJS_READY){
    showToast('Configure o EmailJS primeiro (veja instruções no arquivo)');
    return;
  }
  if(!info.email){ showToast('Este comprador não tem e-mail salvo'); return; }
  const code = ticketCode(currentSessionId, info.seatId);
  try{
    await emailjs.send(emailjsConfig.serviceId, emailjsConfig.templateId, {
      to_email: info.email,
      to_name: info.nome || '',
      show_name: info.show.name || '',
      session_label: sessionLabel(info.session),
      seat_id: info.seatId,
      ticket_code: code,
      status_label: info.status==='vendido' ? 'Pago' : 'Reservado'
    });
    showToast('E-mail enviado para ' + info.email);
  }catch(e){
    showToast('Erro ao enviar e-mail — confira a configuração do EmailJS');
  }
}

/* ---------- Check-in (leitura de QR) ---------- */
let scanStream = null;
let scanLoopId = null;
let lastScanCode = null;
let lastScanAt = 0;

function stopScanner(){
  if(scanLoopId){ cancelAnimationFrame(scanLoopId); scanLoopId = null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
}

async function renderCheckin(){
  if(!currentUser){ renderLoginScreen(); return; }
  detachLiveSeats();
  const content = document.getElementById('content');
  content.innerHTML = `<div class="panel">
    <h2>Check-in — leitura de ingresso</h2>
    <p class="note" style="margin-top:-6px;">Aponte a câmera para o QR code do ingresso (impresso ou na tela do celular da pessoa).</p>
    <button class="btn gold" id="btnStartScan">📷 Ligar câmera</button>
    <button class="btn ghost" id="btnStopScan" style="display:none;">Parar câmera</button>
    <div class="scan-wrap" id="scanWrap" style="display:none;">
      <video id="scanVideo" playsinline muted></video>
      <canvas id="scanCanvas" style="display:none;"></canvas>
    </div>
    <div id="scanResult"></div>
    <div class="field" style="margin-top:16px;"><label>Ou digite o código manualmente</label>
      <div class="row">
        <input id="manualCode" placeholder="Ex: S1_1-A12" style="flex:1;"/>
        <button class="btn ghost tiny" id="btnManualCheck">Verificar</button>
      </div>
    </div>
    <div id="checkinLog"></div>
  </div>`;

  const btnStart = document.getElementById('btnStartScan');
  const btnStop = document.getElementById('btnStopScan');
  const wrap = document.getElementById('scanWrap');
  const video = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  btnStart.addEventListener('click', async ()=>{
    try{
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = scanStream;
      await video.play();
      wrap.style.display = 'block';
      btnStart.style.display = 'none';
      btnStop.style.display = 'inline-block';
      scanLoop(video, canvas, ctx);
    }catch(e){
      showToast('Não consegui acessar a câmera — verifique a permissão do navegador');
    }
  });
  btnStop.addEventListener('click', ()=>{
    stopScanner();
    wrap.style.display = 'none';
    btnStart.style.display = 'inline-block';
    btnStop.style.display = 'none';
  });
  document.getElementById('btnManualCheck').addEventListener('click', ()=>{
    const raw = document.getElementById('manualCode').value.trim();
    if(!raw) return;
    handleScannedText('STUDIOA|'+raw.replace(/^STUDIOA\|/i,''));
  });
}

function scanLoop(video, canvas, ctx){
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if(code && code.data){
      const now = Date.now();
      if(code.data !== lastScanCode || now - lastScanAt > 4000){
        lastScanCode = code.data;
        lastScanAt = now;
        handleScannedText(code.data);
      }
    }
  }
  scanLoopId = requestAnimationFrame(()=> scanLoop(video, canvas, ctx));
}

async function handleScannedText(text){
  const resultBox = document.getElementById('scanResult');
  if(!resultBox) return;
  if(!text.startsWith('STUDIOA|')){
    resultBox.innerHTML = `<div class="scan-banner invalid">❌ Este QR code não é um ingresso do Studio A</div>`;
    return;
  }
  const code = text.replace('STUDIOA|','');
  const idx = code.lastIndexOf('-');
  if(idx<0){
    resultBox.innerHTML = `<div class="scan-banner invalid">❌ Código inválido</div>`;
    return;
  }
  const sessionId = code.slice(0, idx);
  const seatId = code.slice(idx+1);
  const found = findShowAndSession(sessionId);
  if(!found){
    resultBox.innerHTML = `<div class="scan-banner invalid">❌ Sessão não encontrada — pode ser de outro evento</div>`;
    return;
  }
  let seat;
  try{
    const snap = await db.ref('seats/'+sessionId+'/'+seatId).once('value');
    seat = snap.val();
  }catch(e){ seat = null; }

  if(!seat || seat.status==='livre'){
    resultBox.innerHTML = `<div class="scan-banner invalid">❌ Assento ${seatId} não consta como vendido/reservado</div>`;
    addCheckinLog(seatId, found, null, 'invalido');
    return;
  }
  if(seat.checkin){
    const hora = new Date(seat.checkinAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    resultBox.innerHTML = `<div class="scan-banner warn">⚠️ Já tinha dado entrada às ${hora} — ${escapeHtml(seat.nome||'')} — Assento ${seatId}</div>`;
    addCheckinLog(seatId, found, seat, 'repetido');
    return;
  }
  const updated = Object.assign({}, seat, { checkin:true, checkinAt: Date.now() });
  await db.ref('seats/'+sessionId+'/'+seatId).set(updated);
  resultBox.innerHTML = `<div class="scan-banner ok">✅ Entrada confirmada — ${escapeHtml(seat.nome||'')} — Assento ${seatId} — ${escapeHtml(found.show.name)}</div>`;
  addCheckinLog(seatId, found, updated, 'ok');
}

const checkinLogEntries = [];
function addCheckinLog(seatId, found, seat, kind){
  const log = document.getElementById('checkinLog');
  if(!log) return;
  checkinLogEntries.unshift({ time: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}), seatId, showName: found.show.name, nome: seat ? seat.nome : '', kind });
  log.innerHTML = '<div class="found-list">' + checkinLogEntries.slice(0,15).map(e=>
    `<div class="found-item"><span>${e.time} — Assento <b>${e.seatId}</b> — ${escapeHtml(e.nome||'—')} (${escapeHtml(e.showName)})</span><span class="badge ${e.kind==='ok'?'vendido':'reservado'}">${e.kind==='ok'?'entrou':e.kind==='repetido'?'repetido':'inválido'}</span></div>`
  ).join('') + '</div>';
}


function switchTab(tab){
  if(currentTab==='checkin' && tab!=='checkin'){ stopScanner(); }
  currentTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='painel') renderPainel();
  else if(tab==='publico') renderPublico();
  else if(tab==='checkin') renderCheckin();
  else renderConfig();
}

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=> switchTab(b.dataset.tab));
});

/* ---------- PWA (instalar como app) ---------- */
(function setupPWA(){
  const logoSrc = document.querySelector('.brand img').src;

  const manifest = {
    name: "Studio A — Bilheteria",
    short_name: "Studio A",
    start_url: ".",
    scope: ".",
    display: "standalone",
    background_color: "#0c0a0d",
    theme_color: "#0c0a0d",
    icons: [
      { src: logoSrc, sizes: "192x192", type: "image/png" },
      { src: logoSrc, sizes: "512x512", type: "image/png" }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(manifestBlob);
  document.head.appendChild(manifestLink);

  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = logoSrc;
  document.head.appendChild(appleIcon);

  const themeColorMeta = document.createElement('meta');
  themeColorMeta.name = 'theme-color';
  themeColorMeta.content = '#0c0a0d';
  document.head.appendChild(themeColorMeta);

  if('serviceWorker' in navigator){
    const swCode = "self.addEventListener('install', e=>self.skipWaiting());"
      + "self.addEventListener('activate', e=>self.clients.claim());"
      + "self.addEventListener('fetch', e=>{});";
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob), { scope: './' }).catch(()=>{});
  }

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById('btnInstallPWA');
    if(btn) btn.style.display = 'inline-block';
  });
  const installBtn = document.getElementById('btnInstallPWA');
  if(installBtn){
    installBtn.addEventListener('click', async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = 'none';
    });
  }
  window.addEventListener('appinstalled', ()=>{
    const btn = document.getElementById('btnInstallPWA');
    if(btn) btn.style.display = 'none';
  });
})();

(async function init(){
  document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Carregando bilheteria…</div></div>';
  if(!FIREBASE_READY){
    renderSetupScreen();
    return;
  }
  await loadConfig();
  switchTab('publico');
})();
</script>
